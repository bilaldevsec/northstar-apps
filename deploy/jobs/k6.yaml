apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-script
  namespace: nsp-prod
data:
  test.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';
    export const options = {
      stages: [{ duration: '1m', target: 20 }, { duration: '2m', target: 20 }, { duration: '30s', target: 0 }],
      thresholds: { http_req_failed: ['rate<0.01'], http_req_duration: ['p(95)<300'] },
    };
    export default function () {
      const r = http.get('http://orders-api:8000/health');
      check(r, { 'status 200': (x) => x.status === 200 });
      sleep(0.5);
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load-test
  namespace: nsp-prod
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: {role: test}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 12345
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: k6
          image: grafana/k6:latest
          args: ["run", "/scripts/test.js"]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: s, mountPath: /scripts}]
      volumes:
        - name: s
          configMap: {name: k6-script}
